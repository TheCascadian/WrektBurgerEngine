<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="910" height="1890" viewBox="0 0 910 1890" role="img" aria-label="Flowchart of pop moods, elections, seats, coalitions, factions and movements with loops">
<style type="text/css">
.bg{fill:#f6f7f9}.n{stroke-width:3}
.blue{fill:#d6e6fb;stroke:#2b6cc4}.amber{fill:#fde9bd;stroke:#b87a00}.green{fill:#d3f0dc;stroke:#1f8a4c}.red{fill:#fbd9d6;stroke:#c0392b}
.t{font:700 16px "Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;fill:#15181d;text-anchor:middle}.s{font:13px "Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;fill:#4d5663;text-anchor:middle}
.l{stroke:#15181d;stroke-width:3}.l.loop{stroke:#2b6cc4;stroke-dasharray:9 6}
#ah path{fill:#15181d}#ah2 path{fill:#2b6cc4}
.pill.y{fill:#1f8a4c}.pill.n{fill:#c0392b}
.pt{font:700 12px "Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;fill:#fff;text-anchor:middle;letter-spacing:.06em}
.ll{font:italic 13px "Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;fill:#2b6cc4}
</style>
<rect class="bg" width="910" height="1890"/>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<path class="l" d="M300,86 L300,130" fill="none" marker-end="url(#ah)"/>
<path class="l" d="M300,186 L300,230" fill="none" marker-end="url(#ah)"/>
<path class="l" d="M300,286 L300,320" fill="none" marker-end="url(#ah)"/>
